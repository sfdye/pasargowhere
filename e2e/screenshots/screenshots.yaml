appId: ${APP_ID}
tags: [screenshots]
---
# Screenshot capture flow — run against a standalone dev build.
# Produces 5 screenshots per locale for App Store and Play Store listings.
#
# Usage:
#   1. Build: APP_VARIANT=development npx expo run:ios --configuration Release
#   2. npm run screenshots:ios  (or screenshots:android)
#   3. npm run screenshots:copy
#   4. npm run metadata:ios

- runFlow: ./launch.yaml
# App starts on Discover — wait for it to hydrate.
- extendedWaitUntil:
    visible:
      id: discover-row
    timeout: 60000

# Dismiss the reminder prompt card if present.
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
      - waitForAnimationToEnd

# Screenshot 1: Discover tab.
- tapOn:
    id: tab-discover
- waitForAnimationToEnd
- takeScreenshot: 01-discover

# Screenshot 2: My Pasars with a favourited market.
- tapOn:
    id: tab-mypasars
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
      - waitForAnimationToEnd
- takeScreenshot: 02-mypasars

# Screenshot 3: Market detail.
- tapOn:
    id: market-row
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 03-market-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: BackButton
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - waitForAnimationToEnd

# Screenshot 4: Map.
- tapOn:
    id: tab-map
- waitForAnimationToEnd
- takeScreenshot: 04-map

# Screenshot 5: Settings.
- tapOn:
    id: tab-settings
- waitForAnimationToEnd
- takeScreenshot: 05-settings
