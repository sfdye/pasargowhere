appId: ${APP_ID}
tags: [screenshots-zh]
---
# Screenshot capture flow for Chinese (zh-Hans) locale.
# Switches to Chinese first, then adds a favourite, captures all screens.

- runFlow: ./launch.yaml
# App starts on Discover — wait for it to hydrate.
- extendedWaitUntil:
    visible:
      id: discover-row
    timeout: 60000

# --- Switch to Chinese first ---
- tapOn:
    id: tab-settings
- waitForAnimationToEnd
- tapOn:
    id: row-language
- waitForAnimationToEnd
- tapOn:
    id: lang-zh
- waitForAnimationToEnd

# --- Add Tiong Bahru Market as a favourite (in Chinese) ---
- tapOn:
    id: tab-mypasars
- waitForAnimationToEnd
- tapOn:
    id: add-markets
- waitForAnimationToEnd
- tapOn: "搜索.*"
- inputText: 中峇鲁
- tapOn: "中峇鲁巴刹.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "close"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: done-button
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "向上导航"
      - waitForAnimationToEnd

# Dismiss the reminder prompt card if present.
- runFlow:
    when:
      visible: "以后再说"
    commands:
      - tapOn: "以后再说"
      - waitForAnimationToEnd

# Screenshot 1: Discover tab in Chinese.
- tapOn:
    id: tab-discover
- waitForAnimationToEnd
- takeScreenshot: 01-discover

# Screenshot 2: My Pasars in Chinese.
- tapOn:
    id: tab-mypasars
- waitForAnimationToEnd
- takeScreenshot: 02-mypasars

# Screenshot 3: Market detail in Chinese.
- tapOn:
    id: market-row
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 03-market-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: BackButton
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - waitForAnimationToEnd

# Screenshot 4: Map in Chinese.
- tapOn:
    id: tab-map
- waitForAnimationToEnd
- takeScreenshot: 04-map

# Screenshot 5: Settings in Chinese.
- tapOn:
    id: tab-settings
- waitForAnimationToEnd
- takeScreenshot: 05-settings
