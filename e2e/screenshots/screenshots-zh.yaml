appId: ${APP_ID}
tags: [screenshots-zh]
---
# Screenshot capture flow for Chinese (zh-Hans) locale.
# Adds a favourite in English first, switches to Chinese, captures all screens.
# clearState in launch.yaml resets the app for the next run.

- runFlow: ./launch.yaml
# App starts on Discover — wait for it to hydrate.
- extendedWaitUntil:
    visible:
      id: discover-row
    timeout: 20000

# --- Setup: add Tiong Bahru Market as a favourite (while still in English) ---
- tapOn:
    id: tab-mypasars
- waitForAnimationToEnd
- tapOn:
    id: add-markets
- waitForAnimationToEnd
- tapOn: "Search.*"
- inputText: Tiong Bahru
- tapOn: "Tiong Bahru Market"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "close"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: done-button
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Navigate up"
      - waitForAnimationToEnd

# Dismiss the reminder prompt card if present.
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
      - waitForAnimationToEnd

# --- Switch to Chinese ---
- tapOn:
    id: tab-settings
- waitForAnimationToEnd
- tapOn:
    id: row-language
- waitForAnimationToEnd
- tapOn:
    id: lang-zh
- waitForAnimationToEnd

# Screenshot 1: Discover tab in Chinese.
- tapOn:
    id: tab-discover
- waitForAnimationToEnd
- takeScreenshot: 01-discover

# Screenshot 2: My Pasars in Chinese.
- tapOn:
    id: tab-mypasars
- waitForAnimationToEnd
- takeScreenshot: 02-mypasars

# Screenshot 3: Market detail in Chinese.
- tapOn:
    id: market-row
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 03-market-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: BackButton
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - waitForAnimationToEnd

# Screenshot 4: Map in Chinese.
- tapOn:
    id: tab-map
- waitForAnimationToEnd
- takeScreenshot: 04-map

# Screenshot 5: Settings in Chinese.
- tapOn:
    id: tab-settings
- waitForAnimationToEnd
- takeScreenshot: 05-settings
