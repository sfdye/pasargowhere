appId: ${APP_ID}
tags: [smoke]
---
# Onboarding: fresh launch → Discover tab → browse → go to My Pasars → add a market.
- runFlow: ../utils/launch.yaml
# App starts on Discover — wait for it to hydrate.
- extendedWaitUntil:
    visible:
      id: discover-row
    timeout: 20000
# Go to My Pasars tab.
- tapOn:
    id: tab-mypasars
- waitForAnimationToEnd
# No favourites yet — tap the FAB to open the picker.
- tapOn:
    id: add-markets
- waitForAnimationToEnd
# Search for a well-known market.
- tapOn: "Search.*"
- inputText: Tiong Bahru
# Tap the matching picker row.
- tapOn: "Tiong Bahru Market"
# Dismiss the keyboard — iOS uses the search bar Close button, Android uses back key.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "close"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - waitForAnimationToEnd
# Dismiss the add modal — iOS uses Done button, Android uses back.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: done-button
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Navigate up"
      - waitForAnimationToEnd
# Back on My Pasars — the market row should be visible.
- assertVisible:
    id: market-row
    index: 0
